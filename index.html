<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorMew - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Video -->
    <video autoplay loop muted playsinline id="bg-video">
        <source src="mew.mp4" type="video/mp4">
    </video>

    <!-- Canvas for Snow -->
    <canvas id="snow-canvas"></canvas>

    <div class="container">
        <!-- Main Profile Card -->
        <div class="card profile-card glass-panel">
            <div class="avatar-container">
                <img src="pfp.png" alt="CreatorMew" class="avatar">
            </div>
            
            <h1 class="username">CreatorMew</h1>
            <p class="subtitle">Makes games</p>
            
            <div class="portfolio-info">
                <p>minimum 5k Robux &middot; negotiable</p>
                <p>UI/UX systems &middot; custom HUDs &middot; responsive design</p>
                <p>1+ year UI &middot; fast turnaround</p>
            </div>
            
            <div class="social-links">
                <a href="https://discord.com/users/1355857057873531021" target="_blank" class="social-icon discord" title="Discord"><i class="fab fa-discord"></i></a>
                <a href="https://www.roblox.com/users/11078609151/profile" target="_blank" class="social-icon roblox" title="Roblox Profile"><i class="fa-solid fa-gamepad"></i></a>
            </div>
        </div>

        <!-- Portfolio Showcase -->
        <div class="card showcase-card glass-panel">
            <h2>My Works</h2>
            <div class="gallery">
                <div class="gallery-item" style="background-image: url('shopxd.png'); background-color: #2a2a35;">
                    <span class="gallery-title">Shop UI</span>
                </div>
                <div class="gallery-item" style="background-image: url('giftxd.png'); background-color: #2a2a35;">
                    <span class="gallery-title">Gift Menu UI</span>
                </div>
                <div class="gallery-item" style="background-image: url('inventoryxd.png'); background-color: #2a2a35;">
                    <span class="gallery-title">Inventory UI</span>
                </div>
                <div class="gallery-item" style="background-image: url('settingsxd.png'); background-color: #2a2a35;">
                    <span class="gallery-title">Settings UI</span>
                </div>
                <div class="gallery-item" style="background-image: url('abilityxd.png'); background-color: #2a2a35;">
                    <span class="gallery-title">Ability UI</span>
                </div>
                <div class="gallery-item" style="background-image: url('cratexd.png'); background-color: #2a2a35;">
                    <span class="gallery-title">Crates UI</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
